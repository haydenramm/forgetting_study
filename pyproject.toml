[project]
name = "forgetting-study"
version = "0.1.0"
description = "Small transformers on MAD-lab synthetic tasks, with activation and gradient recording"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.10.0",
    "numpy",
    "pyyaml",
    "matplotlib",
    "pillow",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgetting_study"]
